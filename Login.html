    <script>
        var id = 0;
        var user_Data = [];
        if (localStorage.getItem('login')) {
            window.location = '/Ecommerce/index.html';
        }
        if (localStorage.getItem("UsersignIn")) {
            var get = JSON.parse(localStorage.getItem("UsersignIn"));
            user_Data.push(get);
        } else {
            window.location = 'signup.html';
        }
        function save() {
            var email = document.getElementById('email').value;
            var password = document.getElementById('password').value;
            var name = document.getElementsByTagName('span');
            var wrong = document.getElementsByClassName('wrong');
            if (!email && !password) {
                name[0].style.display = "block";
                name[1].style.display = "block";
            } else {
                if (email) {
                    name[0].style.display = "none";
                    if (password) {
                        name[1].style.display = "none";
                        user_Data.forEach((element) => {
                            element.forEach((e) => {
                                if (e.email === email) {
                                    wrong[0].style.display = "none";
                                    if (e.password === password) {
                                        wrong[1].style.display = "none";
                                        var user = {
                                            id: e.id,
                                            user_email: e.email,
                                            user_password: e.password
                                        }
                                        var login_data = JSON.stringify(user);
                                        localStorage.setItem("login", login_data)
                                        //console.log(e.id);
                                        window.location = '/Ecommerce/index.html';
                                        // alert('Welcome Our HOME Page'); -->//
                                    } else {
                                        wrong[1].style.display = "block";
                                    }
                                } else {
                                    wrong[0].style.display = "block";
                                }
                            })
                        });
                    } else {
                        name[1].style.display = "block";
                    }
                } else {
                    name[0].style.display = "block";
                }
            }
        }
    </script>
